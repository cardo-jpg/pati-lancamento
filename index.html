<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lançamento SRI · Patrícia Voggt</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    :root{
      --bg:#0b1525; --surface:#131f30; --surface2:#182538; --border:#1e3045;
      --cyan:#00c6ff; --green:#00e5a0; --yellow:#ffd166; --red:#ff6b6b;
      --purple:#a78bfa; --orange:#f97316; --blue:#60a5fa;
      --text:#f0f4f8; --muted:#7a90a8; --good:#00e5a0;
    }
    *{ box-sizing:border-box; }
    body{ margin:0; color:var(--text); min-height:100vh; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif; -webkit-font-smoothing:antialiased;
      background:
        radial-gradient(1100px 560px at 10% -8%, rgba(0,198,255,.14), transparent 62%),
        radial-gradient(900px 500px at 100% 2%, rgba(0,229,160,.10), transparent 55%),
        radial-gradient(800px 500px at 50% 120%, rgba(96,165,250,.10), transparent 60%),
        var(--bg);
      background-attachment:fixed; }
    .page{ max-width:1400px; margin:0 auto; padding:24px 18px 60px; }

    .top{ display:flex; align-items:flex-start; justify-content:space-between; flex-wrap:wrap; gap:16px; margin-bottom:18px; }
    .brand{ display:flex; align-items:center; gap:14px; }
    .brand-ic{ width:48px; height:48px; border-radius:14px; background:linear-gradient(150deg,var(--cyan),var(--green)); display:flex; align-items:center; justify-content:center; font-size:24px; box-shadow:0 8px 24px rgba(0,198,255,.3); }
    .brand h1{ font-size:1.2rem; margin:0; font-weight:800; letter-spacing:.01em; }
    .brand p{ font-size:.76rem; margin:2px 0 0; color:var(--muted); }
    .top-r{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    .live{ display:inline-flex; align-items:center; gap:7px; font-size:.72rem; font-weight:700; letter-spacing:.06em; color:#aef2d8; background:rgba(0,229,160,.12); border:1px solid rgba(0,229,160,.4); padding:6px 12px; border-radius:20px; }
    .live::before{ content:''; width:7px; height:7px; border-radius:50%; background:var(--green); box-shadow:0 0 9px var(--green); animation:pulse 1.6s infinite; }
    @keyframes pulse{ 0%,100%{ opacity:1; transform:scale(1);} 50%{ opacity:.4; transform:scale(.8);} }
    .presets{ display:flex; background:var(--surface); border:1px solid var(--border); border-radius:9px; overflow:hidden; flex-wrap:wrap; }
    .preset{ padding:7px 12px; font-size:.78rem; cursor:pointer; color:var(--muted); border:none; background:none; font-family:inherit; }
    .preset.active{ background:var(--cyan); color:#04121f; font-weight:700; }
    .dates{ display:flex; align-items:center; gap:6px; background:var(--surface); border:1px solid var(--border); border-radius:9px; padding:4px 8px; }
    .dlbl{ font-size:.72rem; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
    .dates input[type=date]{ background:transparent; border:1px solid var(--border); border-radius:6px; color:#fff; font-family:inherit; font-size:.76rem; padding:4px 6px; color-scheme:dark; cursor:pointer; }
    .dates input[type=date]:focus{ outline:none; border-color:var(--cyan); }
    .dclear{ background:none; border:none; color:var(--muted); cursor:pointer; font-size:.9rem; padding:2px 4px; font-family:inherit; }
    .dclear:hover{ color:#fff; }
    .updated{ font-size:.72rem; color:var(--muted); }
    .btn{ background:var(--surface); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:7px 13px; font-size:.78rem; cursor:pointer; font-family:inherit; }
    .btn:hover{ background:#ffffff12; }

    .tabs{ display:inline-flex; background:var(--surface); border:1px solid var(--border); border-radius:11px; overflow:hidden; margin-bottom:22px; flex-wrap:wrap; }
    .tab{ padding:10px 22px; font-size:.86rem; font-weight:600; cursor:pointer; color:var(--muted); border:none; background:none; font-family:inherit; }
    .tab.active{ background:var(--cyan); color:#04121f; }

    .gauges{ display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:14px; margin-bottom:16px; }
    .gauge-stat-v.pc-ok{ color:#4ade80; }
    .gauge-stat-v.pc-bad{ color:#f87171; }
    .gauge-sub{ font-size:.72rem; color:#9fd8ef; margin-top:-6px; margin-bottom:2px; letter-spacing:.02em; }
    .gauge-card{ background:linear-gradient(160deg, rgba(0,90,120,.28), rgba(19,31,48,.9)); border:1px solid rgba(0,198,255,.28); border-radius:20px; padding:26px 22px; display:flex; flex-direction:column; align-items:center; box-shadow:0 10px 44px rgba(0,60,90,.28); }
    .gauge-card:hover{ border-color:rgba(0,198,255,.5); }
    .gauge-title{ font-size:.98rem; font-weight:800; letter-spacing:.05em; text-transform:uppercase; color:#bfe9fb; margin-bottom:10px; text-align:center; }
    .gauge-wrap{ position:relative; width:100%; max-width:210px; aspect-ratio:200/140; }
    .gauge-svg{ width:100%; height:100%; overflow:visible; }
    .gauge-track{ fill:none; stroke:#ffffff12; stroke-width:14; stroke-linecap:round; }
    .gauge-fill{ fill:none; stroke-width:14; stroke-linecap:round; transition:stroke-dashoffset .6s ease; }
    .gauge-pct{ position:absolute; left:0; right:0; top:52%; transform:translateY(-50%); text-align:center; font-size:2.5rem; font-weight:800; text-shadow:0 2px 12px rgba(0,198,255,.4); }
    .gauge-leg{ font-size:12px; font-weight:700; }
    .gauge-stats{ display:flex; gap:20px; margin-top:8px; flex-wrap:wrap; justify-content:center; }
    .gauge-stat{ text-align:center; }
    .gauge-stat-l{ font-size:.72rem; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
    .gauge-stat-v{ font-size:1.3rem; font-weight:800; margin-top:2px; }

    .lbl{ font-size:.84rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin:30px 0 14px; }
    .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(205px,1fr)); gap:14px; }
    .card{ background:linear-gradient(165deg, rgba(24,37,56,.9), rgba(19,31,48,.7)); border:1px solid var(--border); border-radius:16px; padding:18px 20px; box-shadow:0 4px 22px rgba(0,0,0,.28); transition:transform .15s, border-color .15s; min-height:120px; display:flex; flex-direction:column; justify-content:center; }
    .card:hover{ transform:translateY(-2px); border-color:rgba(0,198,255,.4); }
    .card.hl{ background:linear-gradient(150deg,rgba(0,140,180,.5),rgba(0,80,110,.35)); border-color:rgba(0,198,255,.5); box-shadow:0 10px 34px rgba(0,120,160,.35); }
    .card .k{ font-size:.8rem; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; font-weight:600; }
    .card.hl .k{ color:#bfe9fb; }
    .card .prev{ font-size:.75rem; color:var(--muted); margin-top:3px; }
    .card .v{ font-size:1.9rem; font-weight:800; margin-top:9px; line-height:1.05; white-space:nowrap; }
    .card .v.accent{ color:var(--cyan); } .card .v.good{ color:var(--green); }
    .card .tax{ font-size:.75rem; color:var(--muted); margin-top:6px; }

    .charts2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    .charts3{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
    @media(max-width:1000px){ .charts3{ grid-template-columns:1fr; } }
    @media(max-width:900px){ .charts2{ grid-template-columns:1fr; } .gauges{ grid-template-columns:1fr; } }
    .chart-card{ background:linear-gradient(165deg, rgba(24,37,56,.5), rgba(11,21,37,.7)); border:1px solid var(--border); border-radius:16px; padding:18px; box-shadow:0 4px 20px rgba(0,0,0,.25); }
    .chart-title{ font-size:.8rem; font-weight:700; color:var(--text); margin-bottom:12px; }
    .chart-box{ position:relative; height:230px; }
    .chart-box.tall{ height:300px; }

    .twrap{ overflow-x:auto; border:1px solid var(--border); border-radius:13px; }
    table{ width:100%; border-collapse:collapse; font-size:.9rem; }
    th,td{ padding:13px 15px; text-align:right; white-space:nowrap; border-bottom:1px solid var(--border); }
    th{ color:var(--muted); font-weight:600; font-size:.76rem; text-transform:uppercase; background:var(--surface2); position:sticky; top:0; }
    td:first-child,th:first-child{ text-align:left; max-width:320px; white-space:normal; }
    tr:last-child td{ border-bottom:none; }
    .vlink{ color:var(--cyan); text-decoration:none; font-size:.74rem; }
    .fbar{ display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin:0 0 14px; }
    .w3filter{ width:100%; max-width:340px; padding:10px 14px; background:var(--surface); border:1px solid var(--border); border-radius:10px; color:var(--text); font-family:inherit; font-size:.85rem; }
    .w3filter::placeholder{ color:var(--muted); }
    .stbtns{ display:inline-flex; gap:6px; flex-wrap:wrap; }
    .stbtn{ padding:9px 14px; border-radius:9px; border:1px solid var(--border); background:var(--surface); color:var(--muted); font-family:inherit; font-size:.8rem; font-weight:600; cursor:pointer; white-space:nowrap; }
    .stbtn:hover{ color:var(--text); border-color:rgba(0,198,255,.4); }
    .stbtn.active{ background:var(--cyan); border-color:var(--cyan); color:#04121f; }
    th.sortable{ cursor:pointer; user-select:none; transition:color .12s; }
    th.sortable:hover{ color:var(--cyan); }
    .al{ display:inline-block; font-size:.72rem; font-weight:700; padding:4px 10px; border-radius:7px; white-space:nowrap; }
    .al-ok{ color:#8ef0b0; background:rgba(0,229,160,.14); border:1px solid rgba(0,229,160,.4); }
    .al-alto{ color:#f5cd6b; background:rgba(255,209,102,.14); border:1px solid rgba(255,209,102,.4); }
    .al-crit{ color:#f79a9a; background:rgba(255,107,107,.16); border:1px solid rgba(255,107,107,.45); }
    .al-sem{ color:var(--muted); background:rgba(120,144,168,.12); border:1px solid var(--border); }
    .st{ display:inline-block; font-size:.72rem; font-weight:700; padding:3px 9px; border-radius:7px; white-space:nowrap; }
    .st-on{ color:#8ef0b0; background:rgba(0,229,160,.16); border:1px solid rgba(0,229,160,.45); }
    .st-bad{ color:#f79a9a; background:rgba(255,107,107,.16); border:1px solid rgba(255,107,107,.45); }
    .st-none{ color:var(--muted); }
    .lp-geral{ background:linear-gradient(150deg,rgba(0,140,180,.5),rgba(0,80,110,.35)); border:1px solid rgba(0,198,255,.5); border-radius:16px; padding:16px 24px; display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap; margin-bottom:22px; box-shadow:0 8px 30px rgba(0,120,160,.3); }
    .lp-geral-lbl{ font-size:.95rem; font-weight:800; letter-spacing:.03em; }
    .lp-geral-stats{ display:flex; gap:32px; flex-wrap:wrap; }
    .lp-meta-lbl{ font-size:.62rem; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:#bfe9fb; }
    .lp-meta-val{ font-size:1.5rem; font-weight:800; margin-top:2px; }
    .lp-meta-val.accent{ color:var(--cyan); }
    .lp-panel{ background:linear-gradient(165deg, rgba(24,37,56,.5), rgba(11,21,37,.7)); border:1px solid var(--border); border-radius:16px; padding:20px 22px; box-shadow:0 4px 20px rgba(0,0,0,.25); }
    .lp-header{ display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap; margin-bottom:18px; padding-bottom:16px; border-bottom:1px solid var(--border); }
    .lp-header-name{ font-size:1.1rem; font-weight:800; }
    .lp-header-url{ display:block; font-size:.74rem; color:var(--cyan); text-decoration:none; opacity:.75; margin-top:3px; }
    .lp-header-url:hover{ opacity:1; }
    .lp-header-right{ display:flex; gap:26px; flex-wrap:wrap; }
    .lp-body{ display:grid; grid-template-columns:1fr 1fr; gap:22px; align-items:start; }
    @media(max-width:900px){ .lp-body{ grid-template-columns:1fr; } }
    .fn{ display:flex; flex-direction:column; gap:5px; max-width:540px; margin:0 auto; }
    .fn-seg{ height:80px; display:flex; flex-direction:column; align-items:center; justify-content:center; }
    .fn-lbl{ font-size:.66rem; font-weight:700; letter-spacing:.06em; color:rgba(255,255,255,.8); }
    .fn-val{ font-size:1.5rem; font-weight:800; color:#fff; margin-top:3px; }
    .fn-rate{ text-align:center; margin:1px 0; }
    .fn-pill{ display:inline-block; font-size:.7rem; font-weight:700; color:#bfe9fb; background:rgba(11,21,37,.75); border:1px solid rgba(0,198,255,.4); padding:4px 13px; border-radius:20px; }
    .lp-charts-col{ display:flex; flex-direction:column; gap:14px; }
    .lp-chart-card{ background:rgba(19,31,48,.5); border:1px solid var(--border); border-radius:12px; padding:14px 16px; }
    .lp-chart-title{ font-size:.66rem; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-bottom:10px; }
    .lp-chart-h{ height:118px; }
    .empty,.loading{ text-align:center; color:var(--muted); padding:34px; }
    .foot{ margin-top:26px; font-size:.7rem; color:var(--muted); text-align:center; }
    .err{ color:var(--red); }
  </style>
</head>
<body>
  <div class="page">
    <div class="top">
      <div class="brand">
        <div class="brand-ic">🚀</div>
        <div>
          <h1>Lançamento SRI · Patrícia Voggt</h1>
          <p>Venda de ingressos do Workshop · 19/08 → 27/09</p>
        </div>
      </div>
      <div class="top-r">
        <span class="live">AO VIVO</span>
        <div class="presets" id="presets">
          <button class="preset" data-d="1" onclick="setPreset(this)">Ontem</button>
          <button class="preset" data-d="3" onclick="setPreset(this)">3 dias</button>
          <button class="preset" data-d="7" onclick="setPreset(this)">7 dias</button>
          <button class="preset" data-d="14" onclick="setPreset(this)">14 dias</button>
          <button class="preset active" data-d="all" onclick="setPreset(this)">Tudo</button>
        </div>
        <div class="dates">
          <span class="dlbl">De</span><input type="date" id="dDe" onchange="setDates()">
          <span class="dlbl">até</span><input type="date" id="dAte" onchange="setDates()">
          <button class="dclear" id="dClear" onclick="clearDates()" style="display:none">✕</button>
        </div>
        <button class="btn" onclick="loadAll()">↻ Atualizar</button>
        <div class="updated" id="updated"></div>
      </div>
    </div>

    <div class="tabs">
      <button class="tab active" data-p="geral" onclick="setTab(this)">Geral</button>
      <button class="tab" data-p="campanhas" onclick="setTab(this)">Campanhas</button>
      <button class="tab" data-p="publicos" onclick="setTab(this)">Públicos</button>
      <button class="tab" data-p="criativos" onclick="setTab(this)">Criativos</button>
      <button class="tab" data-p="lp" onclick="setTab(this)">LP</button>
    </div>

    <div id="body"><div class="loading">Carregando dados da planilha…</div></div>
    <div class="foot" id="foot">Vendas vêm da aba "Leads" (preenchida manualmente todo dia) · tráfego da aba "Vendas"</div>
  </div>

  <script>
    // ── Config ───────────────────────────────────────────────────────────────
    const SHEET = '1_kgSkcDhj9sn6Oca7SfYlOs7_Ni0lwRcF0Y28YaRRB0';
    const AB_VENDAS = 'Vendas';      // tráfego (Meta Ads): funil de ingresso
    const AB_LEADS  = 'Leads ';      // vendas diárias manuais: Data, Leads Vendas Org, Leads Vendas Ads
    const AB_METAS  = 'Metas';       // total / orgânico / tráfego
    const START = new Date(2026, 7, 19);   // 19/08/2026 — início da venda de ingressos
    const END   = new Date(2026, 8, 27);   // 27/09/2026 — fim
    const FLOOR = new Date(2026, 7, 19);
    const VERBA = 25125;                    // R$ para vendas de ingresso
    const LP_URL = 'https://abroadercompany.com/desafio-us300-ads/';   // única LP do lançamento
    const METAS_DEFAULT = { total:1200, org:700, traf:500 };

    let DATA = { vendas:[], leadsOrg:{}, leadsAds:{}, leadsDates:[], metas:{...METAS_DEFAULT} };
    let profile='geral', presetDays='all';

    const BRL = v => (v==null||isNaN(v)) ? '—' : 'R$ ' + Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
    const BRLk= v => (v==null||isNaN(v)) ? '—' : 'R$ ' + Number(v).toLocaleString('pt-BR',{maximumFractionDigits:0});
    const NUM = v => (v==null||isNaN(v)) ? '—' : Number(v).toLocaleString('pt-BR',{maximumFractionDigits:0});
    const PCT = v => (v==null||isNaN(v)) ? '—' : Number(v).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1}) + '%';
    const div = (a,b) => b ? a/b : 0;
    const dkey = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');

    function parseBR(s){
      if(s==null) return 0; if(typeof s==='number') return s;
      s=String(s).replace(/R\$/g,'').replace(/%/g,'').replace(/\s/g,'').trim();
      if(!s) return 0; s=s.replace(/\./g,'').replace(',','.');
      const n=parseFloat(s); return isNaN(n)?0:n;
    }

    // ── gviz JSONP ────────────────────────────────────────────────────────────
    let _seq=0;
    function gviz(sheetId, query){
      return new Promise((resolve,reject)=>{
        const cb='__gv_'+(++_seq)+'_'+Date.now();
        const s=document.createElement('script');
        const done=()=>{ try{delete window[cb];}catch(e){} if(s.parentNode)s.parentNode.removeChild(s); clearTimeout(tm); };
        const tm=setTimeout(()=>{done();reject(new Error('timeout'));},25000);
        window[cb]=r=>{ done(); (r&&r.table)?resolve(r.table):reject(new Error('vazio')); };
        s.onerror=()=>{done();reject(new Error('rede'));};
        s.src='https://docs.google.com/spreadsheets/d/'+sheetId+'/gviz/tq?'+query+'&tqx=responseHandler:'+cb;
        document.head.appendChild(s);
      });
    }
    const cNum = c => !c ? 0 : (typeof c.v==='number' ? c.v : parseBR(c.f!=null?c.f:c.v));
    const cStr = c => !c ? '' : (c.f!=null?c.f:(c.v!=null?String(c.v):''));
    const cDate= c => {
      if(!c) return null;
      const f=String(c.f||c.v||'').match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
      if(f){ let y=+f[3]; if(y<100)y+=2000; return new Date(y,+f[2]-1,+f[1]); }
      const iso=String(c.v||c.f||'').match(/(\d{4})-(\d{2})-(\d{2})/);
      if(iso) return new Date(+iso[1],+iso[2]-1,+iso[3]);
      const d=String(c.v||'').match(/Date\((\d+),(\d+),(\d+)/); if(d) return new Date(+d[1],+d[2],+d[3]);
      return null;
    };

    // aba "Vendas" (tráfego): Data, Campanha, Publico, Criativo, Investimento, Impressões,
    // Cliques, Visitas no Site, Add. Carrinho, Valor Carrinho, Checkout, Vendas, Faturamento, Link
    function vendaRows(table){
      const out=[];
      for(const r of (table.rows||[])){
        const c=r.c||[]; const d=cDate(c[0]); if(!d) continue;
        out.push({ date:d, campanha:cStr(c[1])||'—', publico:cStr(c[2])||'—', criativo:cStr(c[3])||'—',
          inv:cNum(c[4]), imp:cNum(c[5]), clk:cNum(c[6]), vis:cNum(c[7]), cart:cNum(c[8]),
          valcart:cNum(c[9]), chk:cNum(c[10]), vendas:cNum(c[11]), fat:cNum(c[12]), link:cStr(c[13]) });
      }
      return out;
    }
    // aba "Leads " (manual): Data, Leads Vendas Org, Leads Vendas Ads  (ACUMULADO por dia)
    function leadsRows(table){
      const org={}, ads={}, dates=[];
      for(const r of (table.rows||[])){
        const c=r.c||[]; const d=cDate(c[0]); if(!d) continue;
        const o=cNum(c[1]), a=cNum(c[2]);
        const k=dkey(d); org[k]=o; ads[k]=a; dates.push(k);
      }
      return { org, ads, dates };
    }
    function readMetas(table){
      const m={...METAS_DEFAULT};
      for(const r of (table.rows||[])){
        const c=r.c||[]; const k=cStr(c[0]).toLowerCase(); const v=parseBR(cStr(c[1]));
        if(!v) continue;
        if(k.includes('total')) m.total=v;
        else if(k.includes('org')) m.org=v;
        else if(k.includes('tráf')||k.includes('traf')) m.traf=v;
      }
      return m;
    }

    // ── Filtro de data ─────────────────────────────────────────────────────────
    let fStart=null, fEnd=null;
    function cutoff(){
      if(presetDays==='all') return FLOOR;
      const t=new Date(); t.setHours(0,0,0,0);
      const c=new Date(t); c.setDate(c.getDate()-Number(presetDays));
      return c<FLOOR?FLOOR:c;
    }
    function hoje(){ const y=new Date(); y.setHours(0,0,0,0); return y; }
    const inRange = d => {
      if(d>hoje()) return false;
      if(fStart && d<fStart) return false;
      if(fEnd   && d>fEnd)   return false;
      return d>=cutoff();
    };

    // ── Vendas manuais (aba Leads): valores ACUMULADOS → viram por-dia ─────────
    // A moça preenche o acumulado do dia. Convertemos pra incremento diário pra o
    // filtro de data funcionar. Ignora dias vazios (não derruba o acumulado a 0).
    function leadsDaily(map){
      const out={}; let prev=0;
      for(const k of DATA.leadsDates){
        const v=map[k]; if(v==null||v==='') continue;
        const inc=v-prev; prev=v; if(inc>0) out[k]=inc;
      }
      return out;
    }
    function leadsInRange(map){
      const d=leadsDaily(map); let t=0;
      for(const k in d){ const p=k.split('-'); if(inRange(new Date(+p[0],+p[1]-1,+p[2]))) t+=d[k]; }
      return t;
    }
    // Último acumulado preenchido (para "Tudo" sem filtro custom) — robustez extra
    function leadsTotalAll(map){ let last=0; for(const k of DATA.leadsDates){ const v=map[k]; if(v!=null&&v!=='') last=v; } return last; }

    // ── Aggregation tráfego ─────────────────────────────────────────────────────
    function agg(rows){
      let inv=0,imp=0,clk=0,vis=0,cart=0,chk=0,vendas=0,fat=0;
      for(const r of rows){ inv+=r.inv;imp+=r.imp;clk+=r.clk;vis+=r.vis;cart+=r.cart;chk+=r.chk;vendas+=r.vendas;fat+=r.fat; }
      return { inv,imp,clk,vis,cart,chk,vendas,fat,
        ctr:div(clk,imp)*100, cpm:div(inv,imp)*1000, cpc:div(inv,clk), cpa:div(inv,vendas),
        roas:div(fat,inv), ticket:div(fat,vendas), connect:div(vis,clk)*100 };
    }

    // ── Gauge ─────────────────────────────────────────────────────────────────
    const ARC=298.5;
    function gauge(title, atual, meta, fmt, mediaDia, metaDia, pace, sub){
      const pct = meta? Math.min(100,Math.max(0,atual/meta*100)) : 0;
      return `<div class="gauge-card"><div class="gauge-title">${title}</div>
        ${sub?`<div class="gauge-sub">${sub}</div>`:''}
        <div class="gauge-wrap"><svg class="gauge-svg" viewBox="0 0 200 140">
          <path class="gauge-track" d="M5,110 A95,95,0,0,1,195,110"/>
          <path class="gauge-fill" d="M5,110 A95,95,0,0,1,195,110" stroke="url(#pg)"
            stroke-dasharray="${ARC} ${ARC}" stroke-dashoffset="${ARC*(1-pct/100)}"/>
          <defs><linearGradient id="pg" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#0088c0"/><stop offset="100%" stop-color="#00e5a0"/></linearGradient></defs>
          <text x="5" y="132" class="gauge-leg" text-anchor="middle" fill="rgba(255,255,255,.7)">${fmt(atual)}</text>
          <text x="195" y="132" class="gauge-leg" text-anchor="middle" fill="rgba(255,255,255,.35)">${meta?fmt(meta):'—'}</text>
        </svg><div class="gauge-pct">${pct.toLocaleString('pt-BR',{maximumFractionDigits:1})}%</div></div>
        <div class="gauge-stats">
          <div class="gauge-stat"><div class="gauge-stat-l">Média/dia</div><div class="gauge-stat-v">${mediaDia}</div></div>
          <div class="gauge-stat"><div class="gauge-stat-l">Meta/dia</div><div class="gauge-stat-v">${metaDia}</div></div>
          ${pace?`<div class="gauge-stat"><div class="gauge-stat-l">Precisa/dia</div><div class="gauge-stat-v ${pace.cls}" title="${pace.tip}">${pace.txt}</div></div>`:''}
        </div></div>`;
    }
    function card(k,v,cls,prev,tax){ return `<div class="card ${cls&&cls.includes('hl')?'hl':''}"><div class="k">${k}</div>${prev?`<div class="prev">${prev}</div>`:''}<div class="v ${cls||''}">${v}</div>${tax?`<div class="tax">${tax}</div>`:''}</div>`; }

    let charts=[];
    function killCharts(){ charts.forEach(c=>{try{c.destroy();}catch(e){}}); charts=[]; }

    // ── RENDER ──────────────────────────────────────────────────────────────────
    function render(){
      killCharts();
      const el=document.getElementById('body');
      if(profile==='geral')   renderGeral(el);
      else if(profile==='lp') renderLP(el);
      else                    renderTabela(el, profile);
      document.getElementById('updated').textContent='Atualizado '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
    }

    function renderGeral(el){
      const rows = DATA.vendas.filter(r=>inRange(r.date));
      const k = agg(rows);
      const m = DATA.metas;

      // Vendas do TRÁFEGO = aba Vendas (número do gerenciador). Orgânico = aba Leads (manual).
      const vTraf = k.vendas;
      const vOrg  = leadsInRange(DATA.leadsOrg);
      const vTot  = vTraf + vOrg;

      // dias
      const daysTotal = Math.max(1, Math.round((END-START)/864e5)+1);
      const hj = hoje();
      const daysElapsed = Math.max(1, Math.min(daysTotal, Math.round((hj-START)/864e5)+1));
      const diasRest = Math.max(1, Math.round((END-hj)/864e5));
      // Vendas de tráfego por dia (aba Vendas) — pra média/dia e gráfico
      const trafByDay={}; for(const r of rows){ if(r.vendas>0){ const kd=dkey(r.date); trafByDay[kd]=(trafByDay[kd]||0)+r.vendas; } }
      const orgD=leadsDaily(DATA.leadsOrg);
      // dias com QUALQUER venda no período (tráfego OU orgânico) — média/dia honesta
      const _diasSet=new Set([...Object.keys(trafByDay), ...Object.keys(orgD).filter(kk=>orgD[kk]>0)]);
      const diasComVenda = Math.max(1, [..._diasSet].filter(kk=>{ const p=kk.split('-'); return inRange(new Date(+p[0],+p[1]-1,+p[2])); }).length);
      const diasComTraf  = Math.max(1, Object.keys(trafByDay).filter(kk=>{ const p=kk.split('-'); return inRange(new Date(+p[0],+p[1]-1,+p[2])); }).length);

      const rTraf=Math.round(vTraf/diasComTraf), rOrg=Math.round(vOrg/diasComVenda), rTot=Math.round(vTot/diasComVenda);
      const rInv=div(k.inv, daysElapsed);

      function paceOf(atual, meta, ritmoAtual, f){
        if(!meta) return null; f=f||NUM;
        const falta=meta-atual;
        if(falta<=0) return { txt:'✓ meta batida', cls:'pc-ok', tip:'Meta atingida' };
        const need=Math.ceil(falta/diasRest);
        const cls = ritmoAtual>=need ? 'pc-ok':'pc-bad';
        return { txt:f(need), cls, tip:f(falta)+' restantes ÷ '+diasRest+' dias até 27/09 · ritmo atual '+f(ritmoAtual)+'/dia' };
      }

      const metaOrg=m.org, metaTraf=m.traf, metaTot=m.total;
      const disp=Math.max(0, VERBA-k.inv);

      let h='';
      h+=`<div class="gauges">`;
      h+=gauge('Ingressos · Tráfego', vTraf, metaTraf, NUM, NUM(rTraf), NUM(Math.round(metaTraf/daysTotal)), paceOf(vTraf,metaTraf,rTraf));
      h+=gauge('Ingressos · Orgânico', vOrg, metaOrg, NUM, NUM(rOrg), NUM(Math.round(metaOrg/daysTotal)), paceOf(vOrg,metaOrg,rOrg));
      h+=gauge('Total de Ingressos', vTot, metaTot, NUM, NUM(rTot), NUM(Math.round(metaTot/daysTotal)), paceOf(vTot,metaTot,rTot));
      h+=gauge('Investimento', k.inv, VERBA, BRLk, BRLk(rInv), BRLk(VERBA/daysTotal), paceOf(k.inv,VERBA,rInv,BRLk), 'Disponível: '+BRLk(disp));
      h+=`</div>`;

      // Tráfego (Meta Ads)
      h+=`<div class="lbl">Tráfego · Meta Ads (venda de ingresso)</div><div class="grid">`;
      h+=card('Investimento', BRL(k.inv), 'hl v', 'Verba: '+BRLk(VERBA), 'Usado '+PCT(div(k.inv,VERBA)*100))
        +card('Ingressos Tráfego', NUM(vTraf), 'accent', 'Fonte: gerenciador')
        +card('CPA (ingresso)', vTraf>0?BRL(div(k.inv,vTraf)):'—', '', 'Custo por ingresso')
        +card('CTR', PCT(k.ctr))
        +card('CPC', BRL(k.cpc));
      h+=`</div>`;

      // Funil de ingresso
      h+=`<div class="lbl">Funil do Ingresso (tráfego)</div><div class="grid">`;
      h+=card('Cliques no Link', NUM(k.clk))
        +card('Visitas no Site', NUM(k.vis), '', '', 'Connect '+PCT(k.connect))
        +card('Checkouts', NUM(k.chk), '', '', 'Visita→Chk '+PCT(div(k.chk,k.vis)*100))
        +card('Ingressos (gerenciador)', NUM(k.vendas), 'accent', '', 'Chk→Venda '+PCT(div(k.vendas,k.chk)*100))
        +card('Ticket Médio', k.vendas>0?BRL(k.ticket):'—')
        +card('ROAS', k.inv>0?PCT(0)==='0,0%'?'—':'':(k.roas).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+'x');
      h+=`</div>`;

      // Gráfico por dia
      h+=`<div class="lbl">Ingressos por Dia — Orgânico × Tráfego + Investimento e CPA</div>
        <div class="chart-card"><div class="chart-box tall"><canvas id="cDia"></canvas></div></div>`;

      el.innerHTML=h;

      // Chart — tráfego vem da aba Vendas (trafByDay), orgânico da aba Leads (orgD)
      const invByDay={}; for(const r of rows){ const kd=dkey(r.date); invByDay[kd]=(invByDay[kd]||0)+r.inv; }
      const dset=new Set();
      Object.keys(invByDay).forEach(k=>{if(invByDay[k]>0)dset.add(k);});
      Object.keys(trafByDay).forEach(k=>dset.add(k)); Object.keys(orgD).forEach(k=>{if(orgD[k]>0)dset.add(k);});
      const dates=[...dset].filter(k=>{const p=k.split('-');return inRange(new Date(+p[0],+p[1]-1,+p[2]));}).sort();
      const labels=dates.map(k=>{const p=k.split('-');return p[2]+'/'+p[1];});
      charts.push(new Chart(document.getElementById('cDia'),{
        data:{ labels, datasets:[
          { type:'bar', label:'Ingressos Orgânicos', data:dates.map(k=>orgD[k]||0), backgroundColor:'#00e5a0cc', borderRadius:4, stack:'v', yAxisID:'y' },
          { type:'bar', label:'Ingressos Tráfego', data:dates.map(k=>trafByDay[k]||0), backgroundColor:'#00c6ffcc', borderRadius:4, stack:'v', yAxisID:'y' },
          { type:'line', label:'Investido/dia', data:dates.map(k=>invByDay[k]||0), borderColor:'#ffd166', backgroundColor:'rgba(255,209,102,.12)', borderWidth:2, pointRadius:3, pointBackgroundColor:'#ffd166', tension:.35, yAxisID:'y1' },
          { type:'line', label:'CPA/dia', data:dates.map(k=>{ const v=trafByDay[k]||0; return v>0?+((invByDay[k]||0)/v).toFixed(2):null; }),
            borderColor:'#f97316', backgroundColor:'transparent', borderWidth:2, borderDash:[5,4], pointRadius:3, pointBackgroundColor:'#f97316', tension:.35, spanGaps:true, yAxisID:'y2' },
        ]},
        options:{ responsive:true, maintainAspectRatio:false, interaction:{mode:'index',intersect:false},
          plugins:{ legend:{labels:{color:'#b8ccdd',boxWidth:14,font:{size:12}}},
            tooltip:{callbacks:{label:c=>{ const l=c.dataset.label;
              return (l.indexOf('Investido')>=0||l.indexOf('CPA')>=0) ? ` ${l}: `+BRL(c.parsed.y) : ` ${l}: ${c.parsed.y}`; }}} },
          scales:{ x:{stacked:true,grid:{color:'#ffffff08'},ticks:{color:'#7a90a8',font:{size:11}}}, y:{stacked:true,grid:{color:'#ffffff08'},ticks:{color:'#7a90a8'},beginAtZero:true},
            y1:{position:'right',grid:{drawOnChartArea:false},ticks:{color:'#ffd166',callback:v=>'R$'+Math.round(v)},beginAtZero:true},
            y2:{position:'right',grid:{drawOnChartArea:false},ticks:{color:'#f97316',callback:v=>'R$'+Math.round(v)},beginAtZero:true} } }
      }));
    }

    // ── Tabelas: Campanhas / Públicos / Criativos ──
    let _sortCol='inv', _sortDir=-1, _filterTxt='';
    function groupBy(rows, field){
      const by={};
      for(const r of rows){ const key=r[field]||'—'; let o=by[key];
        if(!o) o=by[key]={nome:key,link:r.link,inv:0,imp:0,clk:0,vis:0,chk:0,vendas:0,fat:0};
        o.inv+=r.inv;o.imp+=r.imp;o.clk+=r.clk;o.vis+=r.vis;o.chk+=r.chk;o.vendas+=r.vendas;o.fat+=r.fat;
        if(!o.link&&r.link)o.link=r.link;
      }
      return Object.values(by).map(o=>({...o, cpa:div(o.inv,o.vendas), ctr:div(o.clk,o.imp)*100, cpc:div(o.inv,o.clk), roas:div(o.fat,o.inv), ticket:div(o.fat,o.vendas) }));
    }
    function renderTabela(el, prof){
      const field = prof==='campanhas'?'campanha': prof==='publicos'?'publico':'criativo';
      const rows = DATA.vendas.filter(r=>inRange(r.date));
      let list = groupBy(rows, field);
      if(_filterTxt){ const q=_filterTxt.toLowerCase(); list=list.filter(o=>o.nome.toLowerCase().includes(q)); }
      list.sort((a,b)=> _sortDir*((a[_sortCol]||0)-(b[_sortCol]||0)) * (typeof a[_sortCol]==='string'?0:1) || (typeof a[_sortCol]==='string'? _sortDir*String(a[_sortCol]).localeCompare(String(b[_sortCol])):0));
      const titulo = prof==='campanhas'?'Campanha': prof==='publicos'?'Público':'Criativo';
      const cols=[['nome',titulo],['inv','Investido'],['imp','Impr.'],['clk','Cliques'],['ctr','CTR'],['chk','Checkout'],['vendas','Vendas'],['cpa','CPA'],['ticket','Ticket'],['fat','Faturam.']];
      let h=`<div class="fbar"><input class="w3filter" placeholder="🔎 Filtrar ${titulo.toLowerCase()}…" value="${_filterTxt}" oninput="setFilter(this.value)"></div>`;
      h+=`<div class="twrap"><table><thead><tr>`;
      cols.forEach(([c,l])=>{ h+=`<th class="sortable" onclick="setSort('${c}')">${l}${_sortCol===c?(_sortDir<0?' ↓':' ↑'):''}</th>`; });
      if(field==='criativo') h+=`<th>Anúncio</th>`;
      h+=`</tr></thead><tbody>`;
      if(!list.length){ h+=`<tr><td colspan="${cols.length+1}" class="empty">Sem dados no período.</td></tr>`; }
      list.forEach(o=>{
        h+=`<tr>
          <td title="${o.nome}">${o.nome}</td>
          <td>${BRL(o.inv)}</td><td>${NUM(o.imp)}</td><td>${NUM(o.clk)}</td>
          <td>${PCT(o.ctr)}</td><td>${NUM(o.chk)}</td>
          <td><b style="color:var(--cyan)">${NUM(o.vendas)}</b></td>
          <td>${o.vendas>0?BRL(o.cpa):'—'}</td>
          <td>${o.vendas>0?BRL(o.ticket):'—'}</td>
          <td>${BRL(o.fat)}</td>
          ${field==='criativo'?`<td>${o.link?`<a class="vlink" href="${o.link}" target="_blank">🔗 Ver</a>`:'—'}</td>`:''}
        </tr>`;
      });
      h+=`</tbody></table></div>`;
      el.innerHTML=h;
    }

    // ── Aba LP (funil da landing page) — padrão Hire ──
    function lpDaily(rows){
      const map={};
      for(const r of rows){ const k=dkey(r.date); const o=map[k]||(map[k]={clk:0,vis:0,chk:0,vd:0}); o.clk+=r.clk;o.vis+=r.vis;o.chk+=r.chk;o.vd+=r.vendas; }
      const keys=Object.keys(map).sort();
      return { labels:keys.map(k=>{const p=k.split('-');return p[2]+'/'+p[1];}),
        connect:keys.map(k=>{const o=map[k];return (o.clk&&o.vis>0)?+(o.vis/o.clk*100).toFixed(2):null;}),
        checkout:keys.map(k=>{const o=map[k];return o.vis?+(o.chk/o.vis*100).toFixed(2):null;}),
        txconv:keys.map(k=>{const o=map[k];return o.chk?+(o.vd/o.chk*100).toFixed(2):null;}),
        txconvpv:keys.map(k=>{const o=map[k];return o.vis?+(o.vd/o.vis*100).toFixed(2):null;}) };
    }
    function lpLine(cid, labels, data, color){
      const el=document.getElementById(cid); if(!el) return;
      charts.push(new Chart(el,{ type:'line',
        data:{ labels, datasets:[{ data, borderColor:color, backgroundColor:color+'22', borderWidth:2, pointRadius:2, pointBackgroundColor:color, tension:.3, spanGaps:true, fill:true }] },
        options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>' '+PCT(c.parsed.y)}}},
          scales:{ x:{grid:{color:'#ffffff08'},ticks:{color:'#7a90a8',font:{size:9},maxTicksLimit:8}}, y:{grid:{color:'#ffffff08'},ticks:{color:'#7a90a8',font:{size:9},callback:v=>Math.round(v)+'%'},beginAtZero:true} } }
      }));
    }
    function renderLP(el){
      const rows = DATA.vendas.filter(r=>inRange(r.date));
      if(!rows.length){ el.innerHTML='<div class="empty">Sem dados de tráfego no período.</div>'; return; }
      const a=agg(rows);
      // Vendas do tráfego = aba Vendas (gerenciador).
      const vAds = a.vendas;
      const cpa = div(a.inv, vAds);
      const d = lpDaily(rows);

      let h=`<div class="lp-geral"><div class="lp-geral-lbl">LANDING PAGE · Desafio US$300</div><div class="lp-geral-stats">
        <div><div class="lp-meta-lbl">Total Gasto</div><div class="lp-meta-val">${BRL(a.inv)}</div></div>
        <div><div class="lp-meta-lbl">CPA (ingresso)</div><div class="lp-meta-val">${vAds>0?BRL(cpa):'—'}</div></div>
        <div><div class="lp-meta-lbl">Tx Conv Visita→Venda</div><div class="lp-meta-val accent">${PCT(div(vAds,a.vis)*100)}</div></div>
        <div><div class="lp-meta-lbl">Ingressos (tráfego)</div><div class="lp-meta-val">${NUM(vAds)}</div></div>
      </div></div>`;

      // Funil vertical
      const steps=[
        {n:'IMPRESSÕES',      v:a.imp, wt:100, wb:84, rate:'CTR '+PCT(a.ctr)},
        {n:'CLIQUES NO LINK', v:a.clk, wt:84,  wb:66, rate:'CONNECT '+PCT(div(a.vis,a.clk)*100)},
        {n:'VISITAS NO SITE', v:a.vis, wt:64,  wb:48, rate:'CHECKOUT '+PCT(div(a.chk,a.vis)*100)},
        {n:'CHECKOUT',        v:a.chk, wt:44,  wb:30, rate:'TX CONV '+PCT(div(vAds,a.chk)*100)},
        {n:'INGRESSOS',       v:vAds,  wt:26,  wb:18, rate:''},
      ];
      let fn='<div class="fn">';
      for(let si=0;si<steps.length;si++){ const s=steps[si]; const tl=(100-s.wt)/2,tr=(100+s.wt)/2,br=(100+s.wb)/2,bl=(100-s.wb)/2; const H=52-si*6;
        fn+=`<div class="fn-seg" style="clip-path:polygon(${tl}% 0,${tr}% 0,${br}% 100%,${bl}% 100%);background:linear-gradient(180deg,hsla(190,90%,${H}%,.9),hsla(160,85%,${H-6}%,.85))"><div class="fn-lbl">${s.n}</div><div class="fn-val">${NUM(s.v)}</div></div>`;
        if(s.rate) fn+=`<div class="fn-rate"><span class="fn-pill">${s.rate}</span></div>`;
      }
      fn+='</div>';

      h+=`<div class="lp-panel">
        <div class="lp-header">
          <div><div class="lp-header-name">Desafio US$300</div><a class="lp-header-url" href="${LP_URL}" target="_blank">${LP_URL.replace('https://','')}</a></div>
          <div class="lp-header-right">
            <div><div class="lp-meta-lbl">Custo/Visita</div><div class="lp-meta-val">${a.vis?BRL(div(a.inv,a.vis)):'—'}</div></div>
            <div><div class="lp-meta-lbl">Faturamento</div><div class="lp-meta-val">${BRL(a.fat)}</div></div>
          </div>
        </div>
        <div class="lp-body">
          <div>${fn}</div>
          <div class="lp-charts-col">
            <div class="lp-chart-card"><div class="lp-chart-title">Connect Rate (Clique→Visita)</div><div class="lp-chart-h"><canvas id="lpA"></canvas></div></div>
            <div class="lp-chart-card"><div class="lp-chart-title">Checkout Rate (Visita→Checkout)</div><div class="lp-chart-h"><canvas id="lpB"></canvas></div></div>
            <div class="lp-chart-card"><div class="lp-chart-title">Taxa Conversão (Checkout→Ingresso)</div><div class="lp-chart-h"><canvas id="lpC"></canvas></div></div>
            <div class="lp-chart-card"><div class="lp-chart-title">Taxa Conversão (Visita→Ingresso)</div><div class="lp-chart-h"><canvas id="lpD"></canvas></div></div>
          </div>
        </div>
      </div>`;
      el.innerHTML=h;
      lpLine('lpA',d.labels,d.connect,'#00c6ff');
      lpLine('lpB',d.labels,d.checkout,'#ffd166');
      lpLine('lpC',d.labels,d.txconv,'#00e5a0');
      lpLine('lpD',d.labels,d.txconvpv,'#60a5fa');
    }

    // ── Controles ──
    function setTab(btn){ document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); profile=btn.dataset.p; _filterTxt=''; render(); }
    function setPreset(btn){ document.querySelectorAll('.preset').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); presetDays=btn.dataset.d; fStart=fEnd=null; document.getElementById('dDe').value=''; document.getElementById('dAte').value=''; document.getElementById('dClear').style.display='none'; render(); }
    function setDates(){ const de=document.getElementById('dDe').value, ate=document.getElementById('dAte').value;
      fStart = de?new Date(de+'T00:00:00'):null; fEnd = ate?new Date(ate+'T00:00:00'):null;
      if(fStart&&fEnd&&fStart>fEnd){ const t=fStart;fStart=fEnd;fEnd=t; document.getElementById('dDe').value=dkey(fStart); document.getElementById('dAte').value=dkey(fEnd); }
      if(de||ate){ document.querySelectorAll('.preset').forEach(b=>b.classList.remove('active')); presetDays='all'; document.getElementById('dClear').style.display=''; }
      render();
    }
    function clearDates(){ fStart=fEnd=null; document.getElementById('dDe').value=''; document.getElementById('dAte').value=''; document.getElementById('dClear').style.display='none'; document.querySelector('.preset[data-d="all"]').classList.add('active'); render(); }
    function setSort(c){ if(_sortCol===c)_sortDir=-_sortDir; else {_sortCol=c;_sortDir=-1;} render(); }
    function setFilter(v){ _filterTxt=v; render(); }

    // ── Load ──
    async function loadAll(){
      document.getElementById('body').innerHTML='<div class="loading">Carregando dados da planilha…</div>';
      try{
        const [tV, tL, tM] = await Promise.all([
          gviz(SHEET,'sheet='+encodeURIComponent(AB_VENDAS)),
          gviz(SHEET,'sheet='+encodeURIComponent(AB_LEADS)),
          gviz(SHEET,'sheet='+encodeURIComponent(AB_METAS)).catch(()=>null),
        ]);
        DATA.vendas = vendaRows(tV);
        const L = leadsRows(tL); DATA.leadsOrg=L.org; DATA.leadsAds=L.ads; DATA.leadsDates=L.dates;
        if(tM) DATA.metas = readMetas(tM);
        render();
      }catch(e){
        document.getElementById('body').innerHTML='<div class="empty err">Erro ao carregar a planilha. Verifique se está pública e tente ↻ Atualizar.<br><small>'+(e&&e.message||e)+'</small></div>';
      }
    }
    loadAll();
  </script>
</body>
</html>
